        };

        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      // Typewriter
      useEffect(() => {
        const current = animatedRoles[roleIdx];
        const timer = setTimeout(() => {
          if (!isDeleting) {
            setTypedText(current.substring(0, typedText.length + 1));
            if (typedText === current) {
              setTimeout(() => setIsDeleting(true), 1800);
            }
          } else {

              setRoleIdx((prev) => (prev + 1) % animatedRoles.length);

                        {item.highlights.map((h, hIdx) => (
                          <li key={hIdx} className="flex items-start space-x-2">
                            <span className="text-purple-400">▪</span>
                            <span className="leading-relaxed">{h}</span>
                          </li>
                        ))}
                      </ul>
                      {item.skills && (
                        <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                          {item.skills.map((s, sIdx) => (
                            <span key={sIdx} className="px-2 py-0.5 rounded text-[10px] font-mono bg-slate-900 text-slate-300 border border-white/5">
                              {s}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 8. CERTIFICATIONS SECTION */}
          <section id="certifications" className="py-20 lg:py-28 relative">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="text-center max-w-3xl mx-auto mb-16">
                <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-300 border border-emerald-500/20 mb-4">
                  <span>📜</span>
                  <span>CREDENTIALS</span>
                </div>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Certificates & Learning</h2>
                <p className="mt-3 text-lg text-slate-300">Formal certifications and specialized training in analytics & tooling.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {certifications.map((cert, index) => (
                  <div key={index} className="glass-panel p-6 flex flex-col justify-between group hover:border-purple-500/50">
                    <div>
                      <div className="flex items-center justify-between mb-4">
                        <span className="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-purple-500/10 text-purple-300 border border-purple-500/20">
                          {cert.badgeText}
                        </span>
                        <span className="text-xs text-slate-400 font-mono">{cert.date}</span>
                      </div>
                      <h3 className="text-base font-bold text-white group-hover:text-purple-300">{cert.title}</h3>
                      <div className="text-xs font-medium text-cyan-400 mt-0.5">{cert.issuer}</div>
                      <p className="text-xs text-slate-300 leading-relaxed mt-3">{cert.description}</p>
                    </div>
                    <div className="mt-5 pt-3 border-t border-white/5 flex items-center justify-between">
                      <span className="text-[11px] font-mono text-emerald-400">✓ Verified Credential</span>
                      <a href={cert.credentialId} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-purple-400 hover:text-purple-300">
                        Show Credential ↗
                      </a>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* 9. CONTACT SECTION */}
          <section id="contact" className="py-20 lg:py-28 relative">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
              <div className="text-center max-w-3xl mx-auto mb-16">
                <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full text-xs font-semibold bg-purple-500/10 text-purple-300 border border-purple-500/20 mb-4">
                  <span>📬</span>
                  <span>LET’S CONNECT</span>
                </div>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Let’s Turn Data Into Decisions</h2>
                <p className="mt-3 text-lg text-slate-300">
                  Looking for a data analyst, dashboard developer, or someone who can turn complex data into clear business insights? Let’s connect.
                </p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                <div className="lg:col-span-5 space-y-6">
                  <div className="glass-panel p-6 space-y-6">
                    <h3 className="text-xl font-bold text-white">Contact Channels</h3>
                    <div className="space-y-4">
                      <div className="flex items-center space-x-4 p-3 rounded-xl bg-slate-950/60 border border-white/5">
                        <span className="text-xl">✉️</span>
                        <div>
                          <div className="text-[11px] font-mono text-slate-400">EMAIL</div>
                          <a href={`mailto:${personal.email}`} className="text-sm font-semibold text-white hover:text-purple-300">
                            {personal.email}
                          </a>
                        </div>
                      </div>
                      <div className="flex items-center space-x-4 p-3 rounded-xl bg-slate-950/60 border border-white/5">
                        <span className="text-xl">📞</span>
                        <div>
                          <div className="text-[11px] font-mono text-slate-400">PHONE</div>
                          <a href={`tel:${personal.phone}`} className="text-sm font-semibold text-white hover:text-indigo-300">
                            {personal.phone}
                          </a>
                        </div>
                      </div>
                      <div className="flex items-center space-x-4 p-3 rounded-xl bg-slate-950/60 border border-white/5">
                        <span className="text-xl">📍</span>
                        <div>
                          <div className="text-[11px] font-mono text-slate-400">LOCATION</div>
                          <div className="text-sm font-semibold text-white">{personal.location}</div>
                        </div>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-white/10 space-y-3">
                      <div className="text-xs font-mono text-slate-400 uppercase">Profiles & Resume:</div>
                      <div className="flex flex-wrap gap-3">
                        <a href={personal.linkedin} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-950 border border-white/10 hover:border-purple-500/40">
                          LinkedIn ↗
                        </a>
                        <a href={personal.github} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-950 border border-white/10 hover:border-purple-500/40">
                          GitHub ↗
                        </a>
                        <a href={personal.resumeUrl} target="_blank" rel="noopener noreferrer" className="px-4 py-2 rounded-xl text-xs font-semibold bg-purple-600/20 text-purple-300 border border-purple-500/30">
                          Resume (PDF) ↓
                        </a>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7">
                  <div className="glass-panel p-8">
                    <h3 className="text-xl font-bold text-white mb-2">Send a Message</h3>
                    <p className="text-sm text-slate-300 mb-6">Fill out the details below and I will get back to you promptly.</p>

                    {submitSuccess && (
                      <div className="mb-6 p-4 rounded-xl bg-emerald-950/40 border border-emerald-500/40 text-emerald-300 text-sm">
                        ✓ <strong>Message Dispatched!</strong> Thank you for reaching out. I will respond to you shortly.
                      </div>
                    )}

                    <form onSubmit={handleContactSubmit} noValidate className="space-y-5">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                          <label className="block text-xs font-mono uppercase text-slate-300 mb-2">Your Name *</label>
                          <input
                            type="text"
                            value={formData.name}
                            onChange={(e) => setFormData({ ...formData, name: e.target.value })}
                            placeholder="e.g. Jane Doe"
                            className="w-full px-4 py-3 rounded-xl bg-slate-950/70 border border-white/10 text-white text-sm focus:border-purple-500 focus:outline-none"
                          />
                          {formErrors.name && <p className="mt-1 text-xs text-red-400">{formErrors.name}</p>}
                        </div>
                        <div>
                          <label className="block text-xs font-mono uppercase text-slate-300 mb-2">Email Address *</label>
                          <input
                            type="email"
                            value={formData.email}
                            onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                            placeholder="e.g. jane@company.com"
                            className="w-full px-4 py-3 rounded-xl bg-slate-950/70 border border-white/10 text-white text-sm focus:border-purple-500 focus:outline-none"
                          />
                          {formErrors.email && <p className="mt-1 text-xs text-red-400">{formErrors.email}</p>}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-mono uppercase text-slate-300 mb-2">Subject *</label>
                        <input
                          type="text"
                          value={formData.subject}
                          onChange={(e) => setFormData({ ...formData, subject: e.target.value })}
                          placeholder="e.g. Data Analyst Opportunity"
                          className="w-full px-4 py-3 rounded-xl bg-slate-950/70 border border-white/10 text-white text-sm focus:border-purple-500 focus:outline-none"
                        />
                        {formErrors.subject && <p className="mt-1 text-xs text-red-400">{formErrors.subject}</p>}
                      </div>

                      <div>
                        <label className="block text-xs font-mono uppercase text-slate-300 mb-2">Message *</label>
                        <textarea
                          rows="4"
                          value={formData.message}
                          onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                          placeholder="Describe your analytics goals, dataset requirements, or role details..."
                          className="w-full px-4 py-3 rounded-xl bg-slate-950/70 border border-white/10 text-white text-sm focus:border-purple-500 focus:outline-none"
                        ></textarea>
                        {formErrors.message && <p className="mt-1 text-xs text-red-400">{formErrors.message}</p>}
                      </div>

                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="px-8 py-3.5 rounded-xl font-semibold text-sm text-white bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 shadow-lg shadow-purple-600/30 hover:scale-[1.02] disabled:opacity-50"
                      >
                        {isSubmitting ? 'Transmitting Message...' : 'Send Message ✈️'}
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* 10. FOOTER */}
          <footer className="relative bg-slate-950/90 text-slate-400">
            <div className="h-[2px] w-full bg-gradient-to-r from-transparent via-purple-500/80 to-transparent"></div>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6">
                <div className="flex items-center space-x-3">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center font-bold text-white text-xs">
                    {personal.initials || 'DA'}
                  </div>
                  <div>
                    <span className="text-sm font-bold text-white block">{personal.name}</span>
                    <span className="text-xs text-slate-500 font-mono">Data Analyst Portfolio</span>
                  </div>
                </div>

                <div className="flex flex-wrap items-center justify-center gap-6 text-xs font-medium">
                  <a href="#home" className="hover:text-purple-300">Home</a>
                  <a href="#about" className="hover:text-purple-300">About</a>
                  <a href="#skills" className="hover:text-purple-300">Skills</a>
                  <a href="#services" className="hover:text-purple-300">Services</a>
                  <a href="#projects" className="hover:text-purple-300">Projects</a>
                  <a href="#experience" className="hover:text-purple-300">Experience</a>
                  <a href="#contact" className="hover:text-purple-300">Contact</a>
                  <a href={personal.linkedin} target="_blank" rel="noopener noreferrer" className="hover:text-purple-300">LinkedIn</a>
                  <a href={personal.github} target="_blank" rel="noopener noreferrer" className="hover:text-purple-300">GitHub</a>
                </div>

                <button
                  onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                  className="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-900 border border-white/10 text-slate-300 text-xs hover:text-white"
                >
                  <span>Back to top ↑</span>
                </button>
              </div>

              <div className="mt-8 pt-6 border-t border-white/5 text-center text-xs text-slate-500 font-mono">
                <p>© 2026 {personal.name}. Built with Python mindset and modern web technologies.</p>
              </div>
            </div>
          </footer>

          {/* Active Case Study Modal Container */}
          {activeModalProject && (
            <CaseStudyModal
              project={activeModalProject}
              onClose={() => setActiveModalProject(null)}
            />
          )}
        </div>
      );
    }

    // Mount to Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PortfolioApp />);
  </script>
</body>
</html>
